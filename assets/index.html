<!DOCTYPE html>
<html lang="en">
<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>payoo | Login </title>
          <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon">


          <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
          <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" 
          rel="stylesheet">

          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

          <style>
                    *{
                            font-family: "Outfit", sans-serif;
                    }
          </style>
</head>
    <body>
          <div class="min-h-screen max-w-md bg-base-200 mx-auto">
                    <div class="logo w-[265px] mx-auto pt-50">
                              <img src="./Logo-full.png" alt="">
                    </div>
                    <div class="form  pt-10 ">
                              <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow mx-auto">
                              <div class="card-body rounded-3xl">
                              <fieldset class="fieldset gap-2">
                                        <label class="label font-bold text-neutral">Mobile Number</label>
                                        <input maxlength="11" minlength="11"  type="text" class="input rounded-full bg-base-200" placeholder="Enter your 11 digit number" />
                                        <br>

                                        <label  class="label font-bold text-neutral ">4 Digit Pin</label>
                                        <input maxlength="4" minlength="4" type="password" class="input rounded-full bg-base-200 " placeholder="Enter 4 Digit Pin" />
                                        <div><a class="link link-hover font-bold text-neutral">Forgot password?</a></div>
                                        <button class="btn btn-primary mt-4 rounded-full hover:bg-blue-400 text-cyan-20000">Login</button><div class="helo"></div>
                              </fieldset>
                              </div>
                              </div>

                    </div>
          </div>
    </body>

</html>
